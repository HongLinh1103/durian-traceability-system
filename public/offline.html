<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <title>Triviet - Ngoại tuyến</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: linear-gradient(180deg, #f0fdf4, #fff);
            color: #14532d;
        }

        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .card {
            max-width: 420px;
            border-radius: 28px;
            background: white;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(22, 163, 74, .12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #166534;
        }
    </style>
</head>

<body>
    <main>
        <div class="card">
            <h1>Bạn đang ngoại tuyến</h1>
            <p>Ứng dụng vẫn lưu nhật ký vào điện thoại và sẽ tự đồng bộ khi có Internet trở lại.</p>
        </div>
    </main>
</body>

</html>
